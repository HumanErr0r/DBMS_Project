<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}" />
</head>

<body>
    <header>
        <a href="{{ url_for('homepage')}}">
            <img src="{{url_for('static', filename='logo.png')}}" class="logo" />
        </a>
    </header>

    <div class="form-container">
        <h2>Sign Up</h2>
        <form action="/add_user" method="POST">
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" name="firstname" pattern="[A-Za-z0-9_-]{1,40}" required>

            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" pattern="[A-Za-z0-9_-]{1,40}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                pattern="^\+?[0-9]{1,4}[-\s]?[0-9]{1,4}[-\s]?[0-9]{1,4}[-\s]?[0-9]{1,4}$"
                title="Phone number should be between 10-15 digits long, optionally with spaces or dashes, and may start with a '+'."
                required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected> </option>
                <option value="male">male</option>
                <option value="female">female</option>
                <option value="other">other</option>
            </select>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" pattern="^[A-Za-z\d@$!%*?&]{3,}$" required>

            <label for="password">Confirm Password:</label>
            <input type="password" id="password2" name="password2" pattern="^[A-Za-z\d@$!%*?&]{3,}$" required>

            <button type="submit" class="signup-button">Sign Up</button>
        </form>
    </div>

    <h4> Have an account? <a href="/login" class="login-button">Log in!</a></h4>


</body>

</html>
