<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='settings.css') }}" />
</head>

<body>
    <header>
        <div class="logo-container">
            <a href="{{ url_for('homepage')}}">
                <img src="{{url_for('static', filename='logo.png')}}" class="logo" />
            </a>
        </div>
        <div class="logout-container">
            <form action="{{ url_for('logout') }}" method="POST">
                <button type="submit" class="logout-button">Log Out</button>
            </form>
        </div>
    </header>

    <nav class="taskbar">
        <ul>
            <li><a href="{{ url_for('listingsearch')}}"><button>Search for Listings</button></a></li>
            <li><a href="{{ url_for('roommatesearch')}}"><button>Search for Roommates</button></a></li>
            <li><a href="{{ url_for('listings')}}"><button>Manage Your Listings</button></a></li>
            <li><a href="{{ url_for('preferences')}}"><button>Update Preferences</button></a></li>
            <li><a href="{{ url_for('settings')}}"><button>Settings</button></a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Settings for {{ session.get('firstname') }} {{ session.get('lastname') }}</h2>
        <form action="{{ url_for('update_user', user_id=session.get('user_id')) }}" method="POST">
            <div class="settings-grid">
                <!-- Current Info Column -->
                <div class="current-info">
                    <h3>Current Information</h3>
                    <div class="info-row">
                        <label>First Name:</label>
                        <span>{{ user[1] }}</span>
                    </div>
                    <div class="info-row">
                        <label>Last Name:</label>
                        <span>{{ user[2] }}</span>
                    </div>
                    <div class="info-row">
                        <label>Email:</label>
                        <span>{{ user[3] }}</span>
                    </div>
                    <div class="info-row">
                        <label>Phone:</label>
                        <span>{{ user[4] }}</span>
                    </div>
                    <div class="info-row">
                        <label>Gender:</label>
                        <span>{{ user[6] }}</span>
                    </div>
                </div>

                <!-- New Info Column -->
                <div class="new-info">
                    <h3>Update Information</h3>
                    <div class="info-row">
                        <label for="firstname">New First Name:</label>
                        <input type="text" id="firstname" name="firstname" value="{{ user[1] }}"
                            pattern="[A-Za-z0-9_-]{1,40}" required>
                    </div>
                    <div class="info-row">
                        <label for="lastname">New Last Name:</label>
                        <input type="text" id="lastname" name="lastname" value="{{ user[2] }}"
                            pattern="[A-Za-z0-9_-]{1,40}" required>
                    </div>
                    <div class="info-row">
                        <label for="email">New Email:</label>
                        <input type="email" id="email" name="email" value="{{ user[3] }}" required>
                    </div>
                    <div class="info-row">
                        <label for="phone">New Phone:</label>
                        <input type="tel" id="phone" name="phone" value="{{ user[4] }}"
                            pattern="^\+?[0-9]{1,4}[-\s]?[0-9]{1,4}[-\s]?[0-9]{1,4}[-\s]?[0-9]{1,4}$" required
                            title="Phone number should be between 10-15 digits long, optionally with spaces or dashes, and may start with a '+'.">
                    </div>
                    <div class="info-row">
                        <label for="gender">New Gender:</label>
                        <select id="gender" name="gender" required>
                            <option value="male" {% if user[6]=='male' %}selected{% endif %}>male</option>
                            <option value="female" {% if user[6]=='female' %}selected{% endif %}>female</option>
                            <option value="other" {% if user[6]=='other' %}selected{% endif %}>other</option>
                        </select>
                    </div>
                    <div class="info-row">
                        <label for="password">New Password:</label>
                        <input type="password" id="password" name="password" 
                               pattern="[A-Za-z0-9!@#$%^&*()_+]{8,}" 
                               title="Password must be at least 8 characters">
                    </div>
                </div>
            </div>
            <button type="submit" class="update-button">Update Settings</button>
        </form>
    </div>


    </div>

    <form action="{{ url_for('delete_user', user_id=session.get('user_id')) }}" method="POST">
        <button type="submit" class="delete-button">Delete Account</button>
    </form>


</body>

</html>
