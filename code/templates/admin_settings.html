<!DOCTYPE html>
<html>
<head>
    <title>Admin Settings</title>
    <style>
        /* Similar styling as admin.html */
    </style>
</head>
<body>
    <div class="settings-container">
        <h1>Admin Settings</h1>
        
        <form action="{{ url_for('update_admin') }}" method="POST">
            <div class="form-group">
                <label for="password">New Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="button">Update Password</button>
        </form>

        <!-- Create User Section -->
        <div class="settings-section">
            <h2>Create New User</h2>
            <div class="form-container">
                <form action="/add_user" method="POST">
                    <label for="firstname">First Name:</label>
                    <input type="text" id="firstname" name="firstname" pattern="[A-Za-z0-9_-]{1,40}" required>

                    <label for="lastname">Last Name:</label>
                    <input type="text" id="lastname" name="lastname" pattern="[A-Za-z0-9_-]{1,40}" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone"
                        pattern="^\+?[0-9]{1,4}[-\s]?[0-9]{1,4}[-\s]?[0-9]{1,4}[-\s]?[0-9]{1,4}$"
                        title="Phone number should be between 10-15 digits long, optionally with spaces or dashes, and may start with a '+'."
                        required>

                    <label for="gender">Gender:</label>
                    <select id="gender" name="gender" required>
                        <option value="" disabled selected> </option>
                        <option value="male">male</option>
                        <option value="female">female</option>
                        <option value="other">other</option>
                    </select>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" pattern="^[A-Za-z\d@$!%*?&]{3,}$" required>

                    <label for="password2">Confirm Password:</label>
                    <input type="password" id="password2" name="password2" pattern="^[A-Za-z\d@$!%*?&]{3,}$" required>

                    <button type="submit" class="button">Create User</button>
                </form>
            </div>
        </div>

        <form action="{{ url_for('admin_dashboard') }}" method="GET">
            <button type="submit" class="button">Back to Dashboard</button>
        </form>
    </div>
</body>
</html>
