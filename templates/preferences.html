<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Preferences</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='preferences.css') }}" />
</head>

<body>
    <header>
        <div class="logo-container">
            <a href="{{ url_for('homepage')}}">
                <img src="{{url_for('static', filename='logo.png')}}" class="logo" />
            </a>
        </div>
        <div class="logout-container">
            <form action="{{ url_for('logout') }}" method="POST">
                <button type="submit" class="logout-button">Log Out</button>
            </form>
        </div>
    </header>

    <!-- Taskbar (Navigation) -->
    <nav class="taskbar">
        <ul>
            <li><a href="{{ url_for('listingsearch')}}"><button>Search for Listings</button></a></li>
            <li><a href="{{ url_for('roommatesearch')}}"><button>Search for Roommates</button></a></li>
            <li><a href="{{ url_for('listings')}}"><button>Manage Your Listings</button></a></li>
            <li><a href="{{ url_for('preferences')}}"><button>Update Preferences</button></a></li>
            <li><a href="{{ url_for('settings')}}"><button>Settings</button></a></li>
        </ul>
    </nav>


    <main class="preferences-management">
        {% if message %}
        <div class="message">{{ message }}</div>
        {% endif %}

        <!-- Add Preferences Form -->
        <section class="add-preferences">
            <h2>Add New Preferences</h2>
            <div class="preference-card"> <!-- Added preference-card here -->
                <form action="{{ url_for('add_preferences', user_id=session.get('user_id')) }}" method="POST">
                    <div class="form-group">
                        <label for="zipcode">Zip Code:</label>
                        <input type="text" id="zipcode" name="zipcode" required>
                    </div>
                    <div class="form-group">
                        <label for="budget">Budget:</label>
                        <input type="number" id="budget" name="budget" required>
                    </div>
                    <div class="form-group">
                        <label for="rooms">Preferred Rooms:</label>
                        <input type="number" id="rooms" name="rooms" required>
                    </div>
                    <div class="form-group">
                        <label for="propertytype">Property Type:</label>
                        <select id="propertytype" name="propertytype" required>
                            <option value="apartment">Apartment</option>
                            <option value="house">House</option>
                            <option value="condo">Condo</option>
                            <option value="townhouse">Townhouse</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="leaseduration">Lease Duration (months):</label>
                        <input type="number" id="leaseduration" name="leaseduration" required>
                    </div>
                    <button type="submit" class="add-btn">Add Preferences</button>
                </form>
            </div>
        </section>

        <!-- Current Preferences Display and Update -->
        <section class="current-preferences">
            <h2>Current Preferences</h2>
            {% if preference %} <!-- Changed from preferences to preference -->
            <div class="preference-card">
                <form action="{{ url_for('update_preferences', preference_id=preference[0]) }}" method="POST">
                    <div class="form-group">
                        <label for="zipcode">Zip Code:</label>
                        <input type="text" name="zipcode" value="{{ preference[2] }}">
                    </div>
                    <div class="form-group">
                        <label for="budget">Budget:</label>
                        <input type="number" name="budget" value="{{ preference[3] }}">
                    </div>
                    <div class="form-group">
                        <label for="rooms">Rooms:</label>
                        <input type="number" name="rooms" value="{{ preference[4] }}">
                    </div>
                    <div class="form-group">
                        <label for="propertytype">Property Type:</label>
                        <select name="propertytype">
                            <option value="apartment" {% if preference[5]=='apartment' %}selected{% endif %}>Apartment
                            </option>
                            <option value="house" {% if preference[5]=='house' %}selected{% endif %}>House</option>
                            <option value="condo" {% if preference[5]=='condo' %}selected{% endif %}>Condo</option>
                            <option value="townhouse" {% if preference[5]=='townhouse' %}selected{% endif %}>Townhouse
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="leaseduration">Lease Duration:</label>
                        <input type="number" name="leaseduration" value="{{ preference[6] }}">
                    </div>
                    <div class="preference-actions">
                        <button type="submit" class="update-btn">Update</button>
                        <form action="{{ url_for('delete_preferences', preference_id=preference[0]) }}" method="POST"
                            style="display: inline;">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </div>
                </form>
            </div>
            {% else %}
            <p>No preferences set yet.</p>
            {% endif %}
        </section>
    </main>
</body>

</html>
