<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Listings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homepage.css') }}" />
</head>

<body>
    <header>
        <a href="{{ url_for('homepage')}}">
            <img src="{{url_for('static', filename='logo.png')}}" class="logo" />
        </a>
        <form action="{{ url_for('logout') }}" method="POST">
            <button type="submit" class="logout-button">Log Out</button>
        </form>
    </header>

    <!-- Taskbar (Navigation) -->
    <nav class="taskbar">
        <ul>
            <li><a href="{{ url_for('listingsearch')}}"><button>Search for Listings</button></a></li>
            <li><a href="{{ url_for('roommatesearch')}}"><button>Search for Roommates</button></a></li>
            <li><a href="{{ url_for('listings')}}"><button>Manage Your Listings</button></a></li>
            <li><a href="{{ url_for('preferences')}}"><button>Update Preferences</button></a></li>
            <li><a href="{{ url_for('settings')}}"><button>Settings</button></a></li>
        </ul>
    </nav>

    <main class="property-management">
        <!-- Message Display -->
        {% if message %}
        <div class="message">{{ message }}</div>
        {% endif %}

        <!-- Add Property Form -->
        <section class="add-property">
            <h2>Add New Property</h2>
            <form action="{{ url_for('add_property') }}" method="POST">
                <div class="form-group">
                    <label for="propertyname">Property Name:</label>
                    <input type="text" id="propertyname" name="propertyname" required>
                </div>
                <div class="form-group">
                    <label for="street">Street:</label>
                    <input type="text" id="street" name="street" required>
                </div>
                <div class="form-group">
                    <label for="city">City:</label>
                    <input type="text" id="city" name="city" required>
                </div>
                <div class="form-group">
                    <label for="state">State:</label>
                    <input type="text" id="state" name="state" required>
                </div>
                <div class="form-group">
                    <label for="zipcode">Zip Code:</label>
                    <input type="text" id="zipcode" name="zipcode" required>
                </div>
                <div class="form-group">
                    <label for="source">Source:</label>
                    <input type="text" id="source" name="source" required>
                </div>
                <button type="submit">Add Property</button>
            </form>
        </section>
    </main>
</body>

</html>
